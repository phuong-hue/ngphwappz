name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Xcode Project
        run: |
          PROJ=$(find . -name "ThreeOneOSFive.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "Không tìm thấy ThreeOneOSFive.xcodeproj!"
            exit 1
          fi
          WORKDIR=$(dirname "$PROJ")
          echo "WORKDIR=$WORKDIR" >> $GITHUB_ENV
          echo "Thư mục dự án: $WORKDIR"

      - name: Build iOS App (.app)
        run: |
          cd "$WORKDIR"
          mkdir -p build
          
          echo "Bắt đầu biên dịch target 3105..."
          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$(pwd)/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package into IPA
        run: |
          cd "$WORKDIR"
          rm -rf Payload Delta_3105.ipa
          mkdir -p Payload
          
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Lỗi: Không tìm thấy thư mục .app!"
            exit 1
          fi
          
          echo "Đã tìm thấy app tại: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr Delta_3105.ipa Payload
          echo "=== ĐÃ ĐÓNG GÓI THÀNH CÔNG DELTA_3105.IPA ==="
          ls -lh Delta_3105.ipa
          echo "IPA_FILE=$WORKDIR/Delta_3105.ipa" >> $GITHUB_ENV

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Delta_3105_IPA
          path: ${{ env.IPA_FILE }}
          retention-days: 7
