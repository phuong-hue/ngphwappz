name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Project Environment
        run: |
          xcodebuild -version
          
          # Tìm vị trí chính xác của file xcodeproj
          PROJ_PATH=$(find . -name "ThreeOneOSFive.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "Không tìm thấy ThreeOneOSFive.xcodeproj!"
            exit 1
          fi
          
          PROJ_DIR=$(dirname "$PROJ_PATH")
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV
          cd "$PROJ_DIR"
          
          # Lấy danh sách targets/schemes thực tế của dự án để tránh hardcode sai tên
          echo "=== DANH SÁCH TARGETS THỰC TẾ ==="
          xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Build iOS App (Fix Code 65)
        run: |
          cd "$PROJECT_DIR"
          
          # Sử dụng Target gốc "ThreeOneOSFive" bọc trong cấu hình Release không cần ký số
          xcodebuild clean build \
            -project ThreeOneOSFive.xcodeproj \
            -target ThreeOneOSFive \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into IPA
        run: |
          cd "$PROJECT_DIR"
          rm -rf Payload Delta_3105.ipa
          mkdir -p Payload
          
          APP_PATH=$(find ./build_output -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Lỗi: Không tìm thấy thư mục .app sau khi biên dịch!"
            exit 1
          fi
          
          echo "Tìm thấy app tại: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr Delta_3105.ipa Payload
          echo "=== ĐÃ ĐÓNG GÓI IPA THÀNH CÔNG ==="
          ls -lh Delta_3105.ipa
          echo "FINAL_IPA_PATH=$PROJECT_DIR/Delta_3105.ipa" >> $GITHUB_ENV

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Delta_3105_IPA
          path: ${{ env.FINAL_IPA_PATH }}
          retention-days: 7
